[project]
name = "chartlens-engine"
version = "0.1.0"
description = "ChartLens deterministic technical-analysis engine (no I/O)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chartlens-core",
    "numpy>=2.1",
    "pandas>=2.2",
    "pydantic>=2.10",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chartlens_engine"]
