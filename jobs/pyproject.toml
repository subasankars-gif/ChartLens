[project]
name = "chartlens-jobs"
version = "0.1.0"
description = "ChartLens job layer: the tracked production run and the ANALYSIS stage (ADR-0024, ADR-0025)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chartlens-core",
    "chartlens-engine",
    "chartlens-pipeline",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "typer>=0.15",
]

[project.scripts]
chartlens-jobs = "chartlens_jobs.cli:app"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chartlens_jobs"]
