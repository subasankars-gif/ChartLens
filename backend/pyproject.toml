[project]
name = "chartlens-api"
version = "0.1.0"
description = "ChartLens HTTP API (FastAPI, deployed to Cloud Run)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chartlens-core",
    "chartlens-engine",
    "chartlens-pipeline",
    "fastapi>=0.115",
    "firebase-admin>=6.5",
    "google-cloud-firestore>=2.19",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chartlens_api"]
