# Live verification: run a real backfill from NSE on a hosted runner into a
# temporary local lake, then publish a compact review report (no bulk data) to the
# throwaway branch probe-results/ingest. The lake itself is discarded with the runner.

name: Ingest verify

on:
  workflow_dispatch:
    inputs:
      start_date: { description: "YYYY-MM-DD", default: "2006-01-01" }
      end_date: { description: "YYYY-MM-DD", default: "2026-09-29" }
  push:
    branches: ["probe/ingest"]

permissions:
  contents: write   # to publish the report to the throwaway results branch

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      START: ${{ inputs.start_date || '2006-01-01' }}
      END: ${{ inputs.end_date || '2026-09-29' }}
      CHARTLENS_STORAGE__LOCAL_ROOT: ${{ github.workspace }}/lake
      CHARTLENS_RUNTIME__LOG_JSON: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --no-dev --package chartlens-pipeline
      - name: Backfill (twice, to prove idempotency)
        run: |
          mkdir -p out
          set +e
          /usr/bin/time -v uv run --no-sync chartlens-pipeline backfill \
            --start-date "$START" --end-date "$END" --report-file out/run1.json \
            > out/run1.txt 2> out/run1.log
          echo "run1_exit=$?" >> out/exits.txt
          uv run --no-sync chartlens-pipeline backfill \
            --start-date "$START" --end-date "$END" --report-file out/run2.json \
            > out/run2.txt 2> out/run2.log
          echo "run2_exit=$?" >> out/exits.txt
          set -e
          cat out/run1.txt out/run2.txt
      - name: Summarise
        run: |
          uv run --no-sync python scripts/verify_ingestion.py lake out
          grep -E '"severity": "(WARNING|ERROR)"' out/run1.log | head -300 > out/run1-warnings.jsonl || true
          grep '"message": "ingest.date"' out/run1.log | head -3 > out/log-sample.jsonl || true
          tail -60 out/run1.log | grep -v '"message": "ingest.date"' > out/run1-tail.log || true
          rm -f out/run1.log out/run2.log
          du -sh lake >> out/exits.txt
      - name: Publish report to a throwaway branch
        if: always()
        run: |
          set -euo pipefail
          cd out
          git init -q -b probe-results/ingest
          git -c user.name=ingest-verify -c user.email=probe@users.noreply.github.com add -A
          git -c user.name=ingest-verify -c user.email=probe@users.noreply.github.com commit -qm "Ingest verify ($GITHUB_RUN_ID)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-results/ingest
