# Pipeline jobs (ADR-0007).
#
# One workflow, one entrypoint: every job is a `chartlens-pipeline` command. The
# workflow holds no pipeline logic, so moving jobs to Cloud Run Jobs later means
# changing where the container runs, not what it does.
#
# One-off jobs, run by hand. The daily chain is the tracked production refresh
# (production-refresh.yml, ADR-0018): its schedule, its API trigger and its run history
# live there. Both workflows share the concurrency group, so they never write at once.

name: Pipeline job

on:
  workflow_dispatch:
    inputs:
      job:
        description: Job to run
        type: choice
        options: [info, ingest-daily, backfill, reprocess-pending, corporate-actions-fetch, adjust, data-quality, weekly, publish-serving, identity-rebuild, refresh-security]
        default: info
      trade_date:
        description: "ingest-daily: YYYY-MM-DD (blank = latest session)"
        required: false
      start:
        description: "backfill: start YYYY-MM-DD"
        required: false
      end:
        description: "backfill: end YYYY-MM-DD"
        required: false
      symbol:
        description: "refresh-security: exchange symbol"
        required: false
      dry_run:
        description: Print the plan only
        type: boolean
        default: true

# Jobs write to the data lake; never let two run at once.
concurrency:
  group: pipeline-writes
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # GCP Workload Identity Federation (keyless)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      CHARTLENS_RUNTIME__ENVIRONMENT: prod
      CHARTLENS_RUNTIME__LOG_JSON: "true"
      # The lake is GCS when the repository variables are set (README → Production
      # storage); otherwise the runner's disk, which is discarded after the job.
      CHARTLENS_STORAGE__BACKEND: ${{ vars.GCS_BUCKET && 'gcs' || 'local' }}
      CHARTLENS_STORAGE__GCS_BUCKET: ${{ vars.GCS_BUCKET }}
      # A manual publish-serving is recorded in the snapshot history too (ADR-0018).
      CHARTLENS_FIRESTORE__PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      # Inputs are passed through env, never interpolated into the script, so a
      # crafted input value cannot inject shell commands.
      JOB: ${{ inputs.job }}
      TRADE_DATE: ${{ inputs.trade_date }}
      START: ${{ inputs.start }}
      END: ${{ inputs.end }}
      SYMBOL: ${{ inputs.symbol }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --no-dev --package chartlens-pipeline

      - name: Authenticate to GCP (keyless)
        if: vars.GCS_BUCKET != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PIPELINE_SA }}
      - name: Warn when the lake is ephemeral
        if: vars.GCS_BUCKET == ''
        run: echo "::warning::GCS_BUCKET is not set; this job writes to the runner's disk and the data is discarded."

      - name: Run ${{ env.JOB }}
        run: |
          set -euo pipefail
          run() { uv run --no-sync chartlens-pipeline "$@"; }
          if [ "$JOB" = "corporate-actions-fetch" ]; then run corporate-actions fetch; exit 0; fi
          args=("$JOB")
          if [ "$JOB" = "ingest-daily" ] && [ -n "$TRADE_DATE" ]; then args+=(--trade-date "$TRADE_DATE"); fi
          if [ "$JOB" = "backfill" ]; then args+=(--start-date "$START" --end-date "$END"); fi
          if [ "$JOB" = "refresh-security" ]; then args+=("$SYMBOL"); fi
          case "$JOB" in ingest-daily|backfill|refresh-security) dry_ok=1 ;; *) dry_ok=0 ;; esac
          if [ "$DRY_RUN" = "true" ] && [ "$dry_ok" = 1 ]; then
            args+=(--dry-run)
          fi
          uv run --no-sync chartlens-pipeline "${args[@]}"
