# Deploy the API to Cloud Run (ADR-0016) on every merge to main that touches it.
#
# Keyless: GitHub's OIDC token is exchanged for the chartlens-deployer service account
# (Workload Identity Federation, this repository only). The service runs as chartlens-api,
# which can only READ the lake and read/write Firestore app state and run records.
#
# Refresh (ADR-0018): when the variable CHARTLENS_GH_APP_ID is set, the API gets the
# GitHub App's id and, from Secret Manager (secret chartlens-github-app-key), its private
# key. Cloud Run injects the secret; it never passes through this workflow or its logs.

name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - core/**
      - engine/**
      - pipeline/**
      - config/**
      - docker/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/deploy-api.yml
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  REGION: ${{ vars.GCP_REGION }}   # the bucket's region (ADR-0016); set with the M5 setup
  SERVICE: chartlens-api

jobs:
  deploy:
    # Skipped until the M5 setup (ADR-0016, README → API deployment) has created the
    # deployer and the repository variables.
    if: vars.GCP_API_SA != '' && vars.GCP_PROJECT_ID != '' && vars.GCP_REGION != ''
    # M8 completion gate, A6: the live storage target and the GCP identities exist only in the
    # `production` GitHub Environment, which accepts runs from `main` alone. A workflow
    # file that does not name it (an old commit's re-run, another branch) sees neither.
    # Environment variables are read in steps only, never in job-level `if` or `env`.
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/chartlens/api:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: api
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Deploy to Cloud Run
        env:
          ADMIN_EMAILS: ${{ vars.API_ADMIN_EMAILS }}
          BUCKET: ${{ vars.GCS_BUCKET }}
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          API_SA: ${{ vars.GCP_API_SA }}
          GH_APP_ID: ${{ vars.CHARTLENS_GH_APP_ID }}
          REPOSITORY: ${{ github.repository }}
          # The browser origins allowed to call the API (ADR-0017). The product URL comes first.
          # The project's default Hosting domains stay only until chartlenslab.web.app is
          # verified end to end; a follow-up change removes them. Never "*".
          CORS_ORIGINS: '["https://chartlenslab.web.app", "https://chartlens-lake-13934.web.app", "https://chartlens-lake-13934.firebaseapp.com"]'
        run: |
          set -euo pipefail
          # Environment as a file (JSON is valid YAML): values with '@', ',' or quotes need no
          # escaping, unlike --set-env-vars. ADMIN_EMAILS is comma-separated; the API reads
          # a JSON list.
          admins=$(jq -cn --arg s "$ADMIN_EMAILS" '$s | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))')
          origins=$(jq -c . <<<"$CORS_ORIGINS")
          jq -e 'length > 0 and all(.[]; startswith("https://") and (contains("*") | not))' \
            <<<"$origins" > /dev/null || { echo "::error::CORS_ORIGINS must be explicit https origins"; exit 1; }
          jq -n --arg bucket "$BUCKET" --arg project "$PROJECT" --arg admins "$admins" --arg origins "$origins" \
            --arg app "$GH_APP_ID" --arg repo "$REPOSITORY" '{
            CHARTLENS_RUNTIME__ENVIRONMENT: "prod",
            CHARTLENS_STORAGE__BACKEND: "gcs",
            CHARTLENS_STORAGE__GCS_BUCKET: $bucket,
            CHARTLENS_API__FIREBASE_PROJECT_ID: $project,
            CHARTLENS_API__ADMIN_EMAILS: $admins,
            CHARTLENS_API__CORS_ORIGINS: $origins,
            CHARTLENS_API__GITHUB_REPOSITORY: $repo
          } + (if $app != "" then {CHARTLENS_API__GITHUB_APP_ID: $app} else {} end)' > env.yaml
          jq 'del(.CHARTLENS_API__ADMIN_EMAILS)' env.yaml   # log everything but the emails
          secrets=()
          if [ -n "$GH_APP_ID" ]; then
            secrets=(--set-secrets "CHARTLENS_API__GITHUB_APP_PRIVATE_KEY=chartlens-github-app-key:latest")
          fi
          gcloud run deploy "$SERVICE" --image "$IMAGE" --region "$REGION" --project "$PROJECT" \
            --service-account "$API_SA" --allow-unauthenticated \
            --min-instances 0 --max-instances 3 --cpu 1 --memory 1Gi --concurrency 40 \
            --env-vars-file env.yaml "${secrets[@]}"
      - name: Smoke test
        run: |
          set -euo pipefail
          url=$(gcloud run services describe "$SERVICE" --region "$REGION" --project "${{ vars.GCP_PROJECT_ID }}" --format 'value(status.url)')
          echo "service: $url"
          curl -fsS "$url/api/v1/health" | tee health.json
          echo
          # "serving" is null until the daily chain has published a serving snapshot.
          python3 -c "import json; s=json.load(open('health.json'))['serving']; print('serving:', s or 'no snapshot yet')"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$url/api/v1/system/status")
          echo "unauthenticated /system/status -> $code (expected 401)"
          test "$code" = 401
