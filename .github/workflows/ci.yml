name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python — lint, types, tests
    runs-on: ubuntu-latest
    env:
      CHARTLENS_RUNTIME__ENVIRONMENT: ci
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run poe check
      - name: The documented API contract is current
        run: |
          uv run --no-sync python scripts/export_openapi.py
          git diff --exit-code docs/api/openapi.json

  api-emulators:
    name: API — Firebase Auth + Firestore emulators
    runs-on: ubuntu-latest
    needs: python
    env:
      CHARTLENS_REQUIRE_EMULATORS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Real token verification, Firestore allowlist and run store against the emulators
        run: >
          npx --yes firebase-tools@13 emulators:exec --only auth,firestore
          --project demo-chartlens "uv run pytest -m emulator backend/tests pipeline/tests -v"

  frontend:
    name: Frontend — lint, types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Frontend types match the API contract
        run: |
          pnpm gen:api
          git diff --exit-code src/lib/api-schema.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: Frontend end to end — built site against the real API (test lake, synthetic analysed lake)
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          npx playwright install --with-deps chromium
          pnpm e2e:build
          pnpm e2e
          E2E_LAKE=synthetic pnpm e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: frontend/test-results/
          if-no-files-found: ignore

  docker:
    name: Docker — build images
    runs-on: ubuntu-latest
    needs: python
    strategy:
      matrix:
        target: [api, pipeline, jobs]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: chartlens-${{ matrix.target }}:ci
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - name: Smoke test
        run: |
          if [ "${{ matrix.target }}" = "pipeline" ]; then
            docker run --rm chartlens-pipeline:ci info
          elif [ "${{ matrix.target }}" = "jobs" ]; then
            docker run --rm chartlens-jobs:ci --help
          else
            docker run -d --name api -p 8080:8080 chartlens-api:ci
            for i in $(seq 1 20); do curl -fsS localhost:8080/api/v1/health && exit 0; sleep 1; done
            docker logs api; exit 1
          fi
