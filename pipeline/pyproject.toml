[project]
name = "chartlens-pipeline"
version = "0.1.0"
description = "ChartLens data pipeline: providers, raw storage, adjustment, data quality, bar building"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chartlens-core",
    "pandas>=2.2",
    "pydantic>=2.10",
    "typer>=0.15",
]

[project.scripts]
chartlens-pipeline = "chartlens_pipeline.cli:app"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chartlens_pipeline"]
