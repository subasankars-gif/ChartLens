# ChartLens configuration
#
# Precedence (highest first): environment variables → this file → code defaults.
# Env vars use the CHARTLENS_ prefix and "__" for nesting, e.g.
#   CHARTLENS_STORAGE__BACKEND=gcs
#   CHARTLENS_STORAGE__GCS_BUCKET=chartlens-data
#
# Sections marked METHODOLOGY change computed results. They are hashed into the
# methodology_hash stamped on every output. Changing any value here is a
# methodology change: record it in docs/adr and expect a full recalculation.
# A test (core/tests/test_config.py) keeps the methodology values below in sync
# with the code defaults so this file stays the readable source of truth.

# --------------------------------------------------------------- infrastructure

[runtime]
environment = "local"   # local | ci | prod
log_level = "INFO"
log_json = false        # true on Cloud Run for structured logs

[storage]
backend = "local"       # local | gcs
local_root = ".data"
# gcs_bucket = "chartlens-data"

[firestore]
# project_id = "chartlens-prod"
# emulator_host = "localhost:8081"

[api]
cors_origins = ["http://localhost:3000"]
# firebase_project_id and admin_emails come from the deployment environment
# (CHARTLENS_API__FIREBASE_PROJECT_ID, CHARTLENS_API__ADMIN_EMAILS); see ADR-0016.
snapshot_refresh_seconds = 60
weekly_cache_size = 512

[http]                          # outbound requests to market-data sources (bounded retries)
timeout_seconds = 30
max_attempts = 4
backoff_seconds = 2.0           # waits 2s, 4s, 8s between attempts
max_retry_after_seconds = 60
min_request_interval_seconds = 0.5

[providers.nse]                 # established by the NSE probe (ADR-0008)
archive_base_url = "https://nsearchives.nseindia.com"
api_base_url = "https://www.nseindia.com"   # corporate-actions JSON API (ADR-0011)
corporate_actions_first_month = 2006-01-01
udiff_first_date = 2024-01-01   # UDiFF tried first from here; legacy only before
legacy_last_date = 2024-07-05   # last legacy bhavcopy NSE published

# ----------------------------------------------------------------- METHODOLOGY

[universe]
exchange = "NSE"
series = ["EQ", "BE"]          # a security moving between EQ and BE stays the same security
history_target_years = 20      # target, not requirement: keep whatever history exists
analytical_instrument_types = ["EQUITY_SHARE"]  # analysed and scanned; ETFs, rights entitlements stay in canonical data only

[weekly]
grouping = "iso_week"          # sessions bucketed Monday–Sunday (ADR-0004)
week_end_label = "last_session"

[adjustment]                   # ADR-0005
splits = true
bonus = true
rights = true                  # theoretical ex-rights price factor
dividends = false              # charts show prices as traded
validation_min_tolerance = 0.15     # factor VERIFIED if |ln(ex-date gap / factor)| <= max(this, k·sigma)
validation_sigma_multiplier = 5.0   # k
validation_window = 250             # trailing rows for the robust overnight-gap sigma
gap_report_threshold = 0.25         # "large gap" for the market-wide discontinuity report

[data_quality]
max_unexplained_move = 0.25       # adjusted close-to-close move flagged (WARN) when no corporate action explains it
max_missing_session_ratio = 0.02  # above this share of missing sessions: a WARN finding
max_trading_gap_sessions = 65     # absent longer than this (~3 months): continuity break, usable_from moves
unexplained_gap_break = 0.5       # |open / prev close - 1| beyond this, unexplained: continuity break (never an adjustment)
unexplained_gap_min_reference_price = 2.0  # ...only when the previous close is at least Rs 2
max_session_quarantine_ratio = 0.05  # above this share of rejected rows, a session is QUARANTINED, not ingested

[identity]                      # ADR-0009 — which security a row belongs to
link_same_issuer_isin = true    # new ISIN + same issuer + symbol evidence → same security
resolve_without_isin = true     # pre-2011 NSE rows carry no ISIN: resolve by symbol continuity
max_symbol_gap_days = 45        # longest gap across which a symbol counts as continuous
active_within_sessions = 20     # traded within this many sessions of the latest session → ACTIVE

# ----------------------------------------------------------------- ANALYSIS METHODOLOGY
# Hashed separately (analysis_methodology_hash, ADR-0019): changing these never changes
# weekly data. Definitions: ADR-0020.

[analysis.indicators]
sma_periods = [10, 20, 40, 50, 100, 200]   # 10W, 20W, 40W, 50W, 100W, 200W are aliases
ema_periods = [10, 20, 50, 100, 200]
rsi_period = 14                 # Wilder
macd_fast = 12
macd_slow = 26
macd_signal = 9
stochastic_k = 14               # slow stochastic 14/3/3
stochastic_k_smoothing = 3
stochastic_d = 3
roc_period = 12
atr_period = 14                 # Wilder
bollinger_period = 20
bollinger_k = 2.0               # population standard deviations
volume_sma_period = 20
rvol_baseline = 20              # RVOL[t] = v[t] / mean(v[t-20 .. t-1])
volume_trend_short = 10
volume_trend_long = 20
volume_trend_band = 0.10
rvol_expansion = 1.5
rvol_contraction = 0.67

[analysis.swings]               # ADR-0020 §B
primary_method = "ATR"          # FRACTAL | ATR | PERCENT | ZIGZAG — read by every later layer
primary_sensitivity = "INTERMEDIATE"

[analysis.swings.fractal_window]   # bars each side the pivot must dominate
MICRO = 1
MINOR = 2
INTERMEDIATE = 3
MAJOR = 5

[analysis.swings.atr_multiple]     # reversal in ATR(14) at the pivot bar
MICRO = 1.0
MINOR = 2.0
INTERMEDIATE = 3.0
MAJOR = 5.0

[analysis.swings.percent]          # reversal in % of the pivot's high/low
MICRO = 5
MINOR = 10
INTERMEDIATE = 15
MAJOR = 25

[analysis.swings.zigzag_percent]   # classic ZigZag on closes, reversal in %
MICRO = 5
MINOR = 10
INTERMEDIATE = 15
MAJOR = 25

[analysis.structure]            # ADR-0020 §C — from the primary confirmed swings only
equal_tolerance_atr = 0.25      # highs (lows) within this many ATR are EQUAL
break_atr = 0.10                # a break: complete close beyond the level by this many ATR
range_swings = 4                # RANGE when the last 4 confirmed swings ...
range_width_atr = 3.0           # ... span at most 3 ATR

[analysis.fibonacci]            # ADR-0021 §E — confirmed swing legs only
extra_sensitivities = ["MAJOR"] # besides the primary sensitivity (primary method)
min_leg_atr = 2.0               # a meaningful leg spans >= 2 ATR at its end swing
retracements = [0.236, 0.382, 0.5, 0.618, 0.786]
extensions = [1.272, 1.618, 2.618]

[analysis.levels]               # ADR-0021 §D — zones and trendlines
zone_tolerance_atr = 0.5        # a source joins a zone within 0.5 ATR of its mean
zone_min_width_atr = 0.25
max_zones_per_side = 4
dynamic_sources = ["sma_50", "sma_200"]
fibonacci_ratios = [0.382, 0.5, 0.618]
w_touch = 1.0                   # strength = Σ weight × component, reported with components
w_sources = 1.0
w_volume = 0.5
w_recency = 2.0
recency_halflife_weeks = 26.0
level_break_atr = 0.10          # a level flips role on a close beyond it by 0.10 ATR
trendline_min_bars = 4          # bars between the two anchor swings
trendline_max_bars = 104        # validated by a third touch within this many bars
trendline_touch_atr = 0.5
trendline_break_atr = 0.10
max_trendlines_per_side = 2

[analysis.divergence]           # ADR-0021 §F — price swings from structure labels
indicators = ["rsi", "macd", "obv"]
min_bars = 4
max_bars = 52
rsi_min_delta = 2.0             # RSI points
macd_min_delta_atr = 0.05       # x ATR at the second swing
obv_min_delta_volume = 0.05     # x volume SMA at the second swing
expiry_weeks = 26               # FORMING -> EXPIRED (aged out, not proven wrong)

[analysis.volume]               # ADR-0021 §F
breakout_rvol_confirm = 1.5
breakout_rvol_contradict = 0.8
climax_rvol = 2.5
climax_range_atr = 2.0          # true range vs ATR of the bar before
divergence_min = 0.10
obv_trend_bars = 10
obv_trend_band = 0.10

[analysis.volatility]           # ADR-0021 §F — percentiles over previous bars only
lookback = 52
compression_percentile = 20.0
nr_window = 7
expansion_range_atr = 1.5       # true range vs ATR of the bar before
expansion_window = 4

[analysis.candles]              # ADR-0021 §F — K5 subset, complete bars only
context_bars = 5
doji_body = 0.1
shadow_body = 2.0
opposite_shadow = 0.25
star_first_body = 0.6
star_middle_body = 0.3

[analysis.patterns]             # ADR-0022 — common defaults; each [analysis.patterns.<type>] may override
fine_sensitivity = "MICRO"      # swings for flags, pennants and cup handles (primary method)
breakout_atr = 0.25             # close beyond the level by 0.25 x ATR of the bar before
fail_window = 8
completion_window = 52
mm_zone_atr = 0.5
context_lookback = 26
context_move_atr = 2.0
level_tol_atr = 0.5
shape_share = 0.6666666666666666  # definition fit: shape weighs 2/3 (ADR-0022 §15); never tuned

[analysis.patterns.double]
eq_tol_atr = 0.5
min_sep = 4
max_sep = 60
min_height_atr = 2.0
max_wait_bars = 26

[analysis.patterns.triple]
eq_tol_atr = 0.5
min_sep = 8
max_sep = 90
min_height_atr = 2.0
max_wait_bars = 26

[analysis.patterns.head_shoulders]
head_prominence_atr = 1.0
shoulder_tol_atr = 1.5
time_balance_min = 0.4
time_balance_max = 2.5
neckline_max_slope_atr = 0.25
min_height_atr = 2.0
max_span = 104
max_wait_bars = 26

[analysis.patterns.rounding]
rim_tol_atr = 2.0
min_span = 20
max_span = 156
min_r2 = 0.6
vertex_min = 0.25
vertex_max = 0.75
min_depth_atr = 3.0
low_tol_atr = 0.5
max_wait_bars = 26

[analysis.patterns.v]
v_move_atr = 4.0
max_drop_bars = 8
recovery_ratio = 0.618
capitulation_rvol = 1.5
max_wait_bars = 8

[analysis.patterns.rectangle]
band_tol_atr = 0.75
min_height_atr = 2.0
min_span = 8
max_span = 104
max_wait_bars = 52

[analysis.patterns.triangle]
flat_slope_atr = 0.02
symmetry_ratio = 3.0
converge_ratio = 0.75
apex_max_bars = 52
fit_tol_atr = 0.5
min_height_atr = 2.0
min_span = 8
max_span = 104
max_wait_bars = 52

[analysis.patterns.wedge]
flat_slope_atr = 0.02
converge_ratio = 0.75
apex_max_bars = 52
fit_tol_atr = 0.5
min_height_atr = 2.0
min_span = 8
max_span = 104
max_wait_bars = 52

[analysis.patterns.flag]        # max_wait derived: flag_max_bars from the pole's end
pole_atr = 3.0
pole_max_bars = 6
flag_min_bars = 3
flag_max_bars = 12
parallel_tol_atr = 0.05
max_retrace = 0.5
flat_slope_atr = 0.02
fit_tol_atr = 0.5

[analysis.patterns.pennant]
pole_atr = 3.0
pole_max_bars = 6
flag_min_bars = 3
flag_max_bars = 12
parallel_tol_atr = 0.05
max_retrace = 0.5
flat_slope_atr = 0.02
fit_tol_atr = 0.5
converge_ratio = 0.75

[analysis.patterns.cup_handle]
rim_tol_atr = 2.0
cup_min_bars = 7
cup_max_bars = 65
min_depth_atr = 3.0
max_depth_ratio = 0.5
min_r2 = 0.5
handle_min_bars = 1
handle_max_bars = 10
handle_max_ratio = 0.5
max_wait_bars = 13

[analysis.patterns.relevance]     # ADR-0022 §18: declared, never tuned from outcomes
new_pattern_bars = 4              # k <= t < k + 4 weekly bars
recent_breakout_bars = 4          # b <= t < b + 4 weekly bars
approaching_confirmation_atr = 1.0  # |close_t - level_t| <= 1.0 x ATR_t
max_forming_per_type = 2          # most recently known first, ties by pattern_id

[analysis.breakouts]              # ADR-0022 §19: declared observation settings, never tuned
retest_window = 10                # RETEST looked for in (b, b + 10] weekly bars
retest_tol_atr = 0.5              # band = 0.5 x the breakout's frozen reference ATR
level_false_window = 3            # a level's reversal within 3 bars, before a retest
