# ChartLens configuration
#
# Precedence (highest first): environment variables → this file → code defaults.
# Env vars use the CHARTLENS_ prefix and "__" for nesting, e.g.
#   CHARTLENS_STORAGE__BACKEND=gcs
#   CHARTLENS_STORAGE__GCS_BUCKET=chartlens-data
#
# Sections marked METHODOLOGY change computed results. They are hashed into the
# methodology_hash stamped on every output. Changing any value here is a
# methodology change: record it in docs/adr and expect a full recalculation.
# A test (core/tests/test_config.py) keeps the methodology values below in sync
# with the code defaults so this file stays the readable source of truth.

# --------------------------------------------------------------- infrastructure

[runtime]
environment = "local"   # local | ci | prod
log_level = "INFO"
log_json = false        # true on Cloud Run for structured logs

[storage]
backend = "local"       # local | gcs
local_root = ".data"
# gcs_bucket = "chartlens-data"

[firestore]
# project_id = "chartlens-prod"
# emulator_host = "localhost:8081"

[api]
cors_origins = ["http://localhost:3000"]

[http]                          # outbound requests to market-data sources (bounded retries)
timeout_seconds = 30
max_attempts = 4
backoff_seconds = 2.0           # waits 2s, 4s, 8s between attempts
max_retry_after_seconds = 60
min_request_interval_seconds = 0.5

[providers.nse]                 # established by the NSE probe (ADR-0008)
archive_base_url = "https://nsearchives.nseindia.com"
api_base_url = "https://www.nseindia.com"   # corporate-actions JSON API (ADR-0011)
corporate_actions_first_month = 2006-01-01
udiff_first_date = 2024-01-01   # UDiFF tried first from here; legacy only before
legacy_last_date = 2024-07-05   # last legacy bhavcopy NSE published

# ----------------------------------------------------------------- METHODOLOGY

[universe]
exchange = "NSE"
series = ["EQ", "BE"]          # a security moving between EQ and BE stays the same security
history_target_years = 20      # target, not requirement: keep whatever history exists

[weekly]
grouping = "iso_week"          # sessions bucketed Monday–Sunday (ADR-0004)
week_end_label = "last_session"

[adjustment]                   # ADR-0005
splits = true
bonus = true
rights = true                  # theoretical ex-rights price factor
dividends = false              # charts show prices as traded

[data_quality]
max_unexplained_move = 0.25       # close-to-close move flagged when no corporate action explains it
max_missing_session_ratio = 0.02  # above this, status degrades to WARN
max_session_quarantine_ratio = 0.05  # above this share of rejected rows, a session is QUARANTINED, not ingested

[identity]                      # ADR-0009 — which security a row belongs to
link_same_issuer_isin = true    # new ISIN + same issuer + symbol evidence → same security
resolve_without_isin = true     # pre-2011 NSE rows carry no ISIN: resolve by symbol continuity
max_symbol_gap_days = 45        # longest gap across which a symbol counts as continuous
active_within_sessions = 20     # traded within this many sessions of the latest session → ACTIVE
